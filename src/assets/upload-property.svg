<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 224" width="200" height="224" role="img" aria-label="Upload photo">
  <defs>
    <linearGradient id="upp-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f0fe"/>
    </linearGradient>
    <linearGradient id="upp-badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Frame -->
  <rect x="8" y="6" width="184" height="184" rx="20"
        fill="url(#upp-bg)" stroke="#2563eb" stroke-width="3"/>

  <!-- 3D box / asset: three shaded faces for depth -->
  <g stroke="#1e40af" stroke-width="2" stroke-linejoin="round">
    <polygon points="100,58 142,82 100,106 58,82" fill="#a9c4fc"/>
    <polygon points="58,82 100,106 100,152 58,128" fill="#4f8ff7"/>
    <polygon points="142,82 100,106 100,152 142,128" fill="#1d4ed8"/>
  </g>

  <!-- Red "add" badge -->
  <circle cx="150" cy="120" r="20" fill="url(#upp-badge)" stroke="#ffffff" stroke-width="3"/>
  <rect x="140" y="117.5" width="20" height="5" rx="2.5" fill="#ffffff"/>
  <rect x="147.5" y="110" width="5" height="20" rx="2.5" fill="#ffffff"/>

  <!-- Caption -->
  <text x="100" y="214" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="20" font-weight="600" fill="#2563eb">Upload photo</text>
</svg>
